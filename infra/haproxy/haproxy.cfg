global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull

    timeout connect 5s
    timeout client  120s
    timeout server  120s
    timeout http-request 30s

    retries 2

frontend ingestion_http
    bind *:8000
    default_backend ingestion_servers

frontend ingestion_local
    bind 0.0.0.0:8003
    default_backend ingestion_servers

backend ingestion_servers
    balance roundrobin

    option httpchk GET /health
    http-check expect status 200

    default-server inter 3s fall 3 rise 2

    server-template ingestion 2 ingestion-api:8000 check resolvers docker init-addr libc,none



resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
